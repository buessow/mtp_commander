name: Release

# Builds a signed release APK and AAB on every push to the production branch and
# attaches them to a GitHub release tagged v<versionName>.<run number>, then uploads the AAB to
# Google Play's internal testing track. The signing and Play secrets live in the "production"
# environment, which only the production branch may use.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        run: ./gradlew assembleRelease bundleRelease
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      # The tag matches the app's versionName: the base version in build.gradle.kts plus the run number.
      - name: Create GitHub release
        run: |
          base=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          # A re-run of a failed upload keeps its run number, and with it the release made the first time.
          gh release view "v$base.$GITHUB_RUN_NUMBER" >/dev/null 2>&1 ||
          gh release create "v$base.$GITHUB_RUN_NUMBER" --target "$GITHUB_SHA" --generate-notes \
            app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
        env:
          GH_TOKEN: ${{ github.token }}

      # The service account may only release to testing tracks; promote to production in the Play Console.
      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cc.buessow.mtpcommander
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          tracks: internal
          status: completed
